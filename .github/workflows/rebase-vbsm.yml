name: port vbsm onto sunnypilot staging

# Keeps the camera blind spot monitor branch current with upstream sunnypilot
# by CONTENT, not by history. sunnypilot force-pushes staging (observed
# 2026-08-09: same release, rewritten history), which makes rebase-based
# tracking structurally fragile. Instead this takes upstream's tree wholesale,
# overlays the mod's files carried from the current branch head, and commits
# the result as a merge of both - so the branch survives force-pushes, keeps
# its own history reachable, and works identically for ordinary advances.
#
# The one thing it refuses to do is guess: if upstream changed any file the
# mod manages (relative to the recorded base in .github/vbsm-base.json), it
# fails loudly and leaves the branch alone. The device keeps running the last
# good build until a human merges.
#
# Everything runs on git plumbing against a blobless clone - no worktree
# checkout, so the multi-gigabyte prebuilts are never downloaded.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      force_port:
        description: rebuild the port even if already based on current staging
        type: boolean
        default: false

permissions:
  contents: write

env:
  BRANCH: vbsm-sp-staging-v2026.003.000
  MANIFEST: .github/vbsm-base.json

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out the mod branch
        uses: actions/checkout@v4
        with:
          ref: vbsm-sp-staging-v2026.003.000
          fetch-depth: 0
          filter: blob:none

      - name: port the mod onto upstream staging
        id: port
        run: |
          set -euo pipefail
          git config user.name 'vbsm port'
          git config user.email 'noreply@github.com'
          git remote add upstream https://github.com/sunnypilot/sunnypilot.git
          git fetch --filter=blob:none upstream staging

          NEW=$(git rev-parse upstream/staging)
          OLD_HEAD=$(git rev-parse HEAD)

          if [ "${{ inputs.force_port }}" != "true" ] \
             && git merge-base --is-ancestor "$NEW" HEAD 2>/dev/null; then
            echo "already based on current staging (${NEW:0:8}); nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=$(git show "HEAD:$MANIFEST" | jq -r .base)
          FILES=$(git show "HEAD:$MANIFEST" | jq -r '.files[]')
          echo "recorded base ${BASE:0:8} -> new upstream ${NEW:0:8}"

          # refuse to clobber upstream work on the files the mod manages
          drift=""
          for f in $FILES; do
            old=$(git rev-parse -q --verify "$BASE:$f" 2>/dev/null || echo absent)
            new=$(git rev-parse -q --verify "$NEW:$f" 2>/dev/null || echo absent)
            [ "$old" = "$new" ] || drift="$drift $f"
          done
          if [ -n "$drift" ]; then
            echo "::error::sunnypilot changed mod-managed file(s) since the recorded base:$drift - merge by hand, update $MANIFEST, and push."
            exit 1
          fi

          # upstream tree + our files, via plumbing only (no worktree, no blobs)
          git read-tree "$NEW"
          for f in $FILES; do
            mode=$(git ls-tree "$OLD_HEAD" -- "$f" | awk '{print $1}')
            blob=$(git rev-parse "$OLD_HEAD:$f")
            git update-index --add --cacheinfo "$mode,$blob,$f"
          done
          git show "HEAD:$MANIFEST" | jq --arg b "$NEW" '.base = $b' > /tmp/manifest.json
          mblob=$(git hash-object -w /tmp/manifest.json)
          git update-index --add --cacheinfo "100644,$mblob,$MANIFEST"

          TREE=$(git write-tree)
          MSG=$(printf 'vision_bsm: port onto sunnypilot staging %s\n\nUpstream tree with the mod overlaid, carried unchanged from %s.\nA merge of both parents, so the branch history stays reachable whether\nupstream advanced or rewrote staging.\n' "${NEW:0:8}" "${OLD_HEAD:0:8}")
          COMMIT=$(printf '%s' "$MSG" | git commit-tree "$TREE" -p "$NEW" -p "$OLD_HEAD")
          git update-ref "refs/heads/$BRANCH" "$COMMIT"
          echo "ported: $COMMIT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: verify before publishing
        if: steps.port.outputs.changed == 'true'
        run: |
          set -euo pipefail
          C=$(git rev-parse "refs/heads/$BRANCH")
          fail=0
          check() {
            git cat-file blob "$C:$2" | grep -q "$1" \
              || { echo "::error::missing '$1' in $2"; fail=1; }
          }
          check visionbsmd       openpilot/system/manager/process_config.py
          check "Field Debugging Log" CHESTNUT.md
          check "Complete Index" MODS.md
          check vision_bsm       openpilot/selfdrive/car/card.py
          check VBSM             openpilot/selfdrive/selfdrived/selfdrived.py
          check BigConfigControl openpilot/selfdrive/ui/mici/layouts/settings/toggles.py
          check BSM_STATE_PATH   openpilot/selfdrive/ui/mici/onroad/augmented_road_view.py
          check VBSM_PRIVACY     openpilot/system/athena/athenad.py
          check VBSM_WATCHDOG    openpilot/sunnypilot/ui_watchdog.py
          check VBSM_GPU_KICK    openpilot/sunnypilot/ui_watchdog.py
          check VBSM_GPU_FALLBACK openpilot/sunnypilot/modeld_v2/modeld.py
          check VBSM_GPU_PPT     openpilot/sunnypilot/modeld_v2/modeld.py
          check VBSM_GPU_HUD     openpilot/selfdrive/ui/ui_state.py
          check VBSM_HUD         openpilot/selfdrive/ui/mici/onroad/hud_renderer.py
          check VBSM_GPU_IDLE    openpilot/system/hardware/hardwared.py
          check VBSM_QUIET       openpilot/sunnypilot/models/fetcher.py
          check VBSM_EXP_TOGGLE  openpilot/selfdrive/selfdrived/selfdrived.py
          check VBSM_EXP_TOGGLE  openpilot/sunnypilot/mads/mads.py
          check uiwatchdog       openpilot/system/manager/process_config.py
          check VBSM_RESTART     openpilot/system/manager/process.py
          # a lost restart policy is silent until something dies mid-drive, so
          # assert the call sites too, not just the marker comment
          test "$(git cat-file blob "$C:openpilot/system/manager/process.py" \
                  | grep -c 'if self.hold_dead_proc():')" = 2 \
            || { echo "::error::hold_dead_proc not wired into both start() methods"; fail=1; }
          # without this the device would try to compile, which it cannot do
          git rev-parse -q --verify "$C:prebuilt" > /dev/null \
            || { echo "::error::prebuilt marker missing"; fail=1; }
          git cat-file blob "$C:openpilot/sunnypilot/vision_bsm.py" > /tmp/vb.py
          python3 -m py_compile /tmp/vb.py || { echo "::error::daemon does not compile"; fail=1; }
          # regression guards from the route-46 post-mortem:
          # (a) undefined-name sweep catches missed upstream renames that
          #     import tests cannot see (NameError inside function bodies)
          pip install --quiet pyflakes
          NEWBASE=$(git cat-file blob "$C:$MANIFEST" | jq -r .base)
          FILES=$(git cat-file blob "$C:$MANIFEST" | jq -r ".files[]")
          for f in $FILES; do
            case "$f" in
              *.py)
                git cat-file blob "$C:$f" > /tmp/pf.py
                PF=$(python3 -m pyflakes /tmp/pf.py | grep "undefined name" || true)
                [ -z "$PF" ] || { echo "::error::pyflakes $f: $PF"; fail=1; }
                ;;
            esac
          done
          # (b) file-mode parity with upstream - API-authored commits can
          #     silently flatten 100755 to 100644, which kills exec-ed
          #     entrypoints (modeld exited 126 for a whole drive)
          for f in $FILES; do
            UP=$(git ls-tree "$NEWBASE" -- "$f" | awk '{print $1}')
            OURS=$(git ls-tree "$C" -- "$f" | awk '{print $1}')
            [ -z "$UP" ] || [ "$UP" = "$OURS" ] || { echo "::error::mode mismatch $f: ours $OURS vs upstream $UP"; fail=1; }
          done
          exit $fail

      - name: publish
        if: steps.port.outputs.changed == 'true'
        run: git push --force-with-lease origin "$BRANCH"
