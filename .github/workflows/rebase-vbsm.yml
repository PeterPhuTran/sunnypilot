name: rebase vbsm onto sunnypilot staging

# Keeps the camera blind spot monitor branch current with upstream sunnypilot.
#
# The comma tracks refs/heads/vbsm-sp-staging-v2026.003.000 on this fork instead of sunnypilot staging,
# so upstream changes only reach the device once this branch is rebased onto
# them. Running daily keeps the lag under a day.
#
# A conflict here is the signal that sunnypilot has edited one of the six files
# the mod touches. The job fails loudly and stops publishing rather than
# resolving it blindly - the device keeps running the last good build until a
# human looks, which is the safe direction to fail.
#
# Lives on the default branch because scheduled workflows only run from there,
# which also keeps it out of the vbsm diff against upstream.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: check out vbsm
        uses: actions/checkout@v4
        with:
          ref: vbsm-sp-staging-v2026.003.000
          fetch-depth: 0
          # the repo carries prebuilt binaries and is several GB; fetch commits
          # now and blobs only if the rebase actually needs them
          filter: blob:none

      - name: rebase onto upstream staging
        id: rebase
        run: |
          set -euo pipefail
          git config user.name 'vbsm rebase'
          git config user.email 'noreply@github.com'
          git remote add upstream https://github.com/sunnypilot/sunnypilot.git
          git fetch --filter=blob:none upstream staging

          if ! base=$(git merge-base HEAD upstream/staging 2>/dev/null); then
            echo "::error::No common ancestor: sunnypilot force-pushed staging and rewrote its history. Rebase cannot work; re-port the mod content-wise onto the new staging (see the archive/ branches for prior history)."
            exit 1
          fi
          target=$(git rev-parse upstream/staging)
          if [ "$base" = "$target" ]; then
            echo "upstream staging has not moved; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "rebasing $(git rev-list --count "$base"..HEAD) commit(s) onto $(git rev-parse --short "$target")"
          if ! git rebase --onto upstream/staging "$base"; then
            git rebase --abort || true
            echo "::error::Rebase conflict: sunnypilot changed a file the blind spot mod patches. Resolve by hand, then push vbsm-sp-staging-v2026.003.000."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: verify the mod survived the rebase
        if: steps.rebase.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # A clean rebase can still drop a change if upstream refactored around
          # it, so check the markers rather than trusting the exit code.
          fail=0
          check() {
            if ! grep -q "$1" "$2"; then echo "::error::missing '$1' in $2"; fail=1; fi
          }
          check visionbsmd      openpilot/system/manager/process_config.py
          check vision_bsm      openpilot/selfdrive/car/card.py
          check VBSM            openpilot/selfdrive/selfdrived/selfdrived.py
          check BigConfigControl openpilot/selfdrive/ui/mici/layouts/settings/toggles.py
          check BSM_STATE_PATH  openpilot/selfdrive/ui/mici/onroad/augmented_road_view.py
          test -f openpilot/sunnypilot/vision_bsm.py || { echo "::error::daemon missing"; fail=1; }
          # without this marker the device would try to compile on boot, which
          # is exactly what it cannot do
          test -f prebuilt || { echo "::error::prebuilt marker missing - device would try to build"; fail=1; }
          python3 -m py_compile openpilot/sunnypilot/vision_bsm.py
          exit $fail

      - name: publish
        if: steps.rebase.outputs.changed == 'true'
        run: git push --force-with-lease origin vbsm-sp-staging-v2026.003.000
